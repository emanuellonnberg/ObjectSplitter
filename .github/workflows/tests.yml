name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cover the Python range Cura ships across the supported range:
        # Cura 5.0 -> py3.10, 5.7 -> py3.11, 5.12 -> py3.12.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        # Also smoke the Windows-first target on the Cura 5.12 interpreter.
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run pytest
        run: pytest
